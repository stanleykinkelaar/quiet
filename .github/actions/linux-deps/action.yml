name: Install GPUI's Linux build dependencies
description: >
  Installs the system libraries GPUI links against. The packages are kept in
  the Actions cache, so a normal run installs them in seconds without touching
  the network. Only the first run on a new runner image downloads them.

runs:
  using: composite
  steps:
    # The cached packages only fit the runner image they were downloaded for,
    # so the image version is part of the cache key.
    - name: Read the runner image version
      id: image
      shell: bash
      run: echo "version=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore the cached packages
      id: cache
      uses: actions/cache@v6
      with:
        path: /tmp/linux-deps
        key: linux-deps-${{ steps.image.outputs.version }}-${{ hashFiles('.github/actions/linux-deps/action.yml') }}

    - name: Download the packages
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DEBS: /tmp/linux-deps
        PACKAGES: >-
          libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev
          libwayland-dev libfreetype-dev libfontconfig-dev libvulkan-dev
      run: |
        # The runner's apt mirrors sometimes stop resolving for hours. Without
        # limits apt then hangs for many minutes, so every call gets a hard
        # time limit, and a failed attempt moves on to the next mirror.
        apt_get() {
          sudo timeout 60 apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            "$@"
        }

        download() {
          sudo rm -rf "$DEBS"
          sudo mkdir -p "$DEBS/partial"
          # A failed update is fine when the package lists that ship with the
          # runner image are still good enough to find the packages.
          apt_get update || true
          apt_get install --download-only -y --no-install-recommends \
            -o Dir::Cache::archives="$DEBS" $PACKAGES
        }

        mirrors=/etc/apt/apt-mirrors.txt
        downloaded=false
        # First the runner's own mirror list, then two mirrors on other domains.
        for mirror in default \
          https://archive.ubuntu.com/ubuntu/ \
          https://mirrors.edge.kernel.org/ubuntu/; do
          if [ "$mirror" != default ]; then
            [ -f "$mirrors" ] || continue
            echo "Trying $mirror"
            echo "$mirror" | sudo tee "$mirrors" > /dev/null
          fi
          if download; then
            downloaded=true
            break
          fi
        done

        if [ "$downloaded" != true ]; then
          echo "::error::Could not download the Linux build dependencies from any mirror."
          exit 1
        fi

        # Keep only the packages, readable by the cache step.
        sudo rm -rf "$DEBS/partial" "$DEBS/lock"
        sudo chown -R "$(id -u):$(id -g)" "$DEBS"

    - name: Install the packages
      shell: bash
      env:
        DEBS: /tmp/linux-deps
      run: |
        shopt -s nullglob
        debs=("$DEBS"/*.deb)
        if [ "${#debs[@]}" -gt 0 ]; then
          # apt gets the packages as local files and also finds them in its
          # download folder, so it installs them without using the network.
          sudo mkdir -p "$DEBS/partial"
          sudo timeout 120 apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$DEBS" "${debs[@]}"
          # Leave only the packages behind, so the cache step can save them.
          sudo rm -rf "$DEBS/partial" "$DEBS/lock"
        fi
