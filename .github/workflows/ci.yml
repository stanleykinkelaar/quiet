name: CI

# Checks that Quiet still builds on every system, for each pull request.
# Pushes to main are built (and released) by release.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI's build dependencies
        if: runner.os == 'Linux'
        run: |
          # The runner's first apt mirror, azure.archive.ubuntu.com, sometimes
          # stops resolving for hours. Drop it so apt uses archive.ubuntu.com.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libwayland-dev libfreetype-dev libfontconfig-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p quiet-store
      # A full debug build, so linking is checked too, not just types.
      - run: cargo build --locked --workspace
